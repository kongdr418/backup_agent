<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <!-- 箭头三角形 -->
    <polygon id="arrow" points="0,0 14,-7 14,7" fill="#3B82F6"/>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 装饰性背景圆 -->
  <circle cx="200" cy="650" r="120" fill="#DBEAFE" fill-opacity="0.4"/>
  <circle cx="1100" cy="100" r="100" fill="#DBEAFE" fill-opacity="0.3"/>

  <!-- 标题 -->
  <text x="60" y="110" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="36px" font-weight="bold" fill="#1E293B">课程大纲</text>

  <!-- 流程箭头图 -->
  <g transform="translate(0, 0)">
    <!-- 六个 box 定义: x坐标, 文字 -->
    <!-- 总宽度计算: 6 boxes * 130 + 5 gaps * 40 = 980, 居中偏移: (1280-980)/2 = 150 -->
    <!-- y 位置: 从 y=280 开始, 高度 60, 圆角 -->
    <!-- 每个 box 内: 数字圆圈在左边, 文字在右边 -->
    
    <!-- box1: 什么是 -->
    <rect x="150" y="280" width="130" height="60" rx="10" ry="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <circle cx="175" cy="310" r="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="175" y="315" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" font-weight="bold" fill="#2563EB" text-anchor="middle">1</text>
    <text x="195" y="316" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#1E293B">什么是</text>

    <!-- 箭头1 -->
    <use href="#arrow" x="290" y="306"/>

    <!-- box2: 环境搭建 -->
    <rect x="320" y="280" width="130" height="60" rx="10" ry="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <circle cx="345" cy="310" r="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="345" y="315" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" font-weight="bold" fill="#2563EB" text-anchor="middle">2</text>
    <text x="365" y="316" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#1E293B">环境搭建</text>

    <!-- 箭头2 -->
    <use href="#arrow" x="460" y="306"/>

    <!-- box3: 项目结构 -->
    <rect x="490" y="280" width="130" height="60" rx="10" ry="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <circle cx="515" cy="310" r="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="515" y="315" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" font-weight="bold" fill="#2563EB" text-anchor="middle">3</text>
    <text x="535" y="316" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#1E293B">项目结构</text>

    <!-- 箭头3 -->
    <use href="#arrow" x="630" y="306"/>

    <!-- box4: 开发流程 -->
    <rect x="660" y="280" width="130" height="60" rx="10" ry="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <circle cx="685" cy="310" r="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="685" y="315" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" font-weight="bold" fill="#2563EB" text-anchor="middle">4</text>
    <text x="705" y="316" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#1E293B">开发流程</text>

    <!-- 箭头4 -->
    <use href="#arrow" x="800" y="306"/>

    <!-- box5: 组件API -->
    <rect x="830" y="280" width="130" height="60" rx="10" ry="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <circle cx="855" cy="310" r="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="855" y="315" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" font-weight="bold" fill="#2563EB" text-anchor="middle">5</text>
    <text x="875" y="316" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#1E293B">组件API</text>

    <!-- 箭头5 -->
    <use href="#arrow" x="970" y="306"/>

    <!-- box6: 总结 -->
    <rect x="1000" y="280" width="130" height="60" rx="10" ry="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <circle cx="1025" cy="310" r="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="1025" y="315" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" font-weight="bold" fill="#2563EB" text-anchor="middle">6</text>
    <text x="1045" y="316" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#1E293B">总结</text>
  </g>

  <!-- 底部辅助说明 -->
  <text x="640" y="440" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#64748B" text-anchor="middle">六步走，全面掌握小程序开发</text>
</svg>