<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <!-- 鼠标点击图标 -->
    <g id="icon-mouse-click">
      <path d="M3 3l7.5 18l3.5 -6.5l6.5 -3.5z" fill="#2563EB"/>
    </g>
    <!-- Bug 调试图标 -->
    <g id="icon-bug">
      <path d="M12 4a4 4 0 0 1 4 4v2a4 4 0 0 1 -8 0v-2a4 4 0 0 1 4 -4zm-5 5h-2v2h2v1a5 5 0 0 0 10 0v-1h2v-2h-2v-1a5 5 0 0 0 -10 0v1z" fill="#2563EB"/>
      <circle cx="9" cy="12" r="1" fill="#FFFFFF"/>
      <circle cx="15" cy="12" r="1" fill="#FFFFFF"/>
    </g>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <circle cx="1100" cy="100" r="160" fill="#DBEAFE" fill-opacity="0.3"/>
  <circle cx="80" cy="650" r="120" fill="#DBEAFE" fill-opacity="0.2"/>

  <!-- 标题区域 -->
  <rect x="60" y="80" width="6" height="36" rx="3" fill="#2563EB"/>
  <text x="80" y="106" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="36px" font-weight="bold" fill="#1E293B">开发流程演示</text>

  <!-- 左侧流程连线 -->
  <line x1="82" y1="224" x2="82" y2="562" stroke="#E2E8F0" stroke-width="2"/>

  <!-- 步骤1 -->
  <rect x="60" y="180" width="44" height="44" rx="22" fill="#2563EB"/>
  <text x="82" y="208" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="22px" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="120" y="208" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="20px" font-weight="bold" fill="#1E293B">创建小程序页面</text>
  <text x="120" y="236" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#64748B">在 pages 目录下新建文件夹和四个核心文件</text>

  <!-- 步骤2 -->
  <rect x="60" y="300" width="44" height="44" rx="22" fill="#3B82F6"/>
  <text x="82" y="328" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="22px" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="120" y="328" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="20px" font-weight="bold" fill="#1E293B">编辑 WXML 与 WXSS</text>
  <text x="120" y="356" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#64748B">WXML 搭建视图结构，WXSS 控制页面样式</text>

  <!-- 步骤3 -->
  <rect x="60" y="420" width="44" height="44" rx="22" fill="#2563EB"/>
  <text x="82" y="448" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="22px" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="120" y="448" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="20px" font-weight="bold" fill="#1E293B">编写 JS 逻辑层</text>
  <text x="120" y="476" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#64748B">在 JS 文件中定义 data 和事件处理函数</text>

  <!-- 步骤4 -->
  <rect x="60" y="540" width="44" height="44" rx="22" fill="#3B82F6"/>
  <text x="82" y="568" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="22px" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="120" y="568" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="20px" font-weight="bold" fill="#1E293B">编译与真机调试</text>
  <text x="120" y="596" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#64748B">点击编译预览效果，使用真机调试测试 API</text>

  <!-- 右侧提示面板 -->
  <rect x="700" y="180" width="520" height="440" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="740" y="225" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="22px" font-weight="bold" fill="#1E293B">开发工具提示</text>
  <line x1="740" y1="245" x2="1180" y2="245" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- 编译预览提示 -->
  <rect x="740" y="280" width="48" height="48" rx="12" fill="#DBEAFE"/>
  <use href="#icon-mouse-click" x="752" y="292" width="24" height="24"/>
  <text x="800" y="308" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="18px" font-weight="bold" fill="#1E293B">编译预览 (Ctrl + R)</text>
  <text x="800" y="332" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#64748B">快速查看页面效果，及时调整布局</text>

  <!-- 真机调试提示 -->
  <rect x="740" y="370" width="48" height="48" rx="12" fill="#DBEAFE"/>
  <use href="#icon-bug" x="752" y="382" width="24" height="24"/>
  <text x="800" y="398" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="18px" font-weight="bold" fill="#1E293B">真机调试</text>
  <text x="800" y="422" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#64748B">在微信客户端真实环境测试 API</text>

  <!-- 额外提示框 -->
  <rect x="740" y="500" width="440" height="80" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="760" y="530" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#1E293B">💡 提示：真机调试需要扫码授权</text>
  <text x="760" y="556" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#64748B">确保手机与电脑在同一网络下</text>

  <!-- 页脚 -->
  <text x="60" y="680" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="14px" fill="#64748B">6 / 8 · 开发流程演示</text>
</svg>