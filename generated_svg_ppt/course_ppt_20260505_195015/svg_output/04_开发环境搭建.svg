<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <polygon id="tri" points="0,0 10,-5 10,5" fill="#64748B"/>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 装饰背景圈 -->
  <circle cx="1200" cy="100" r="140" fill="#DBEAFE" fill-opacity="0.35"/>
  <circle cx="80" cy="680" r="100" fill="#DBEAFE" fill-opacity="0.2"/>

  <!-- 标题 -->
  <text x="80" y="106" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="36px" font-weight="bold" fill="#1E293B">开发环境搭建</text>
  <rect x="60" y="82" width="6" height="36" rx="3" fill="#2563EB"/>

  <!-- 左侧：编号步骤 -->
  <!-- 步骤1 -->
  <text x="120" y="204" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="18px" fill="#1E293B">注册微信小程序账号（mp.weixin.qq.com）</text>
  <rect x="60" y="180" width="36" height="36" rx="18" ry="18" fill="#1E40AF"/>
  <text x="78" y="204" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="18px" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>

  <!-- 步骤2 -->
  <text x="120" y="274" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="18px" fill="#1E293B">下载<tspan font-weight="bold">微信开发者工具</tspan>（官方 IDE）</text>
  <text x="120" y="300" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#64748B">支持 Windows / Mac</text>
  <rect x="60" y="250" width="36" height="36" rx="18" ry="18" fill="#1E40AF"/>
  <text x="78" y="274" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="18px" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- 步骤3 -->
  <text x="120" y="354" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="18px" fill="#1E293B">创建第一个项目：<tspan font-weight="bold">AppID</tspan>、项目名称、目录</text>
  <text x="120" y="380" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#64748B">可使用测试号</text>
  <rect x="60" y="330" width="36" height="36" rx="18" ry="18" fill="#1E40AF"/>
  <text x="78" y="354" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="18px" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>

  <!-- 右侧：截图占位（模拟开发者工具界面） -->
  <g transform="translate(680, 180)">
    <!-- 整个窗口背景 -->
    <rect x="0" y="0" width="520" height="420" rx="8" ry="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

    <!-- 窗口标题栏 -->
    <rect x="0" y="0" width="520" height="36" rx="8" ry="8" fill="#E2E8F0"/>
    <rect x="0" y="28" width="520" height="8" fill="#E2E8F0"/>
    <circle cx="16" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="34" cy="18" r="5" fill="#10B981"/>
    <circle cx="52" cy="18" r="5" fill="#E2E8F0"/>
    <text x="260" y="23" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="13px" fill="#64748B" text-anchor="middle">微信开发者工具 - 模拟器</text>

    <!-- 菜单栏 -->
    <rect x="0" y="36" width="520" height="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="12" y="54" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="12px" fill="#64748B">文件 编辑 选择 视图 工具 项目</text>

    <!-- 左侧来源面板 -->
    <rect x="0" y="64" width="160" height="356" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="10" y="86" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="13px" font-weight="bold" fill="#1E293B">项目文件</text>
    <!-- 模拟文件树 -->
    <text x="10" y="112" font-family="Courier New, monospace" font-size="11px" fill="#1E293B">📁 miniprogram</text>
    <text x="26" y="132" font-family="Courier New, monospace" font-size="11px" fill="#1E293B">📁 pages</text>
    <text x="42" y="152" font-family="Courier New, monospace" font-size="11px" fill="#1E293B">📁 index</text>
    <text x="58" y="172" font-family="Courier New, monospace" font-size="11px" fill="#64748B">📄 index.wxml</text>
    <text x="58" y="192" font-family="Courier New, monospace" font-size="11px" fill="#64748B">📄 index.wxss</text>
    <text x="58" y="212" font-family="Courier New, monospace" font-size="11px" fill="#64748B">📄 index.js</text>
    <text x="58" y="232" font-family="Courier New, monospace" font-size="11px" fill="#64748B">📄 index.json</text>
    <text x="26" y="256" font-family="Courier New, monospace" font-size="11px" fill="#1E293B">📄 app.js</text>
    <text x="26" y="276" font-family="Courier New, monospace" font-size="11px" fill="#1E293B">📄 app.json</text>
    <text x="26" y="296" font-family="Courier New, monospace" font-size="11px" fill="#1E293B">📄 app.wxss</text>

    <!-- 右侧代码编辑器区域 -->
    <rect x="160" y="64" width="200" height="356" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="170" y="86" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="12px" fill="#64748B">index.js</text>
    <text x="170" y="112" font-family="Courier New, monospace" font-size="11px" fill="#1E293B">Page({</text>
    <text x="170" y="132" font-family="Courier New, monospace" font-size="11px" fill="#1E293B">  data: {</text>
    <text x="186" y="152" font-family="Courier New, monospace" font-size="11px" fill="#2563EB">    msg: 'Hello'</text>
    <text x="170" y="172" font-family="Courier New, monospace" font-size="11px" fill="#1E293B">  },</text>
    <text x="170" y="192" font-family="Courier New, monospace" font-size="11px" fill="#1E293B">  onLoad() {</text>
    <text x="186" y="212" font-family="Courier New, monospace" font-size="11px" fill="#1E293B">    console.log('loaded')</text>
    <text x="170" y="232" font-family="Courier New, monospace" font-size="11px" fill="#1E293B">  }</text>
    <text x="170" y="252" font-family="Courier New, monospace" font-size="11px" fill="#1E293B">})</text>

    <!-- 预览/模拟器面板（右侧） -->
    <rect x="360" y="64" width="160" height="356" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="440" y="86" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="12px" fill="#64748B" text-anchor="middle">模拟器预览</text>
    <!-- 模拟手机屏幕 -->
    <rect x="390" y="110" width="100" height="180" rx="12" ry="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <!-- 手机顶部状态栏 -->
    <rect x="390" y="110" width="100" height="20" rx="12" ry="12" fill="#E2E8F0"/>
    <rect x="390" y="122" width="100" height="8" fill="#E2E8F0"/>
    <text x="440" y="126" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="11px" fill="#64748B" text-anchor="middle">9:41</text>
    <!-- 模拟页面内容 -->
    <text x="440" y="160" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="11px" fill="#1E293B" text-anchor="middle">Hello</text>
    <text x="440" y="180" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="11px" fill="#64748B" text-anchor="middle">这是一个小程序</text>
  </g>

  <!-- 页面底部页脚 -->
  <text x="60" y="680" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="14px" fill="#64748B">4 / 8 · 开发环境搭建</text>
</svg>