<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <!-- 移动设备图标 (tabler-filled smartphone) -->
    <g id="icon-mobile">
      <path d="M7 4a2 2 0 0 1 2 -2h6a2 2 0 0 1 2 2v16a2 2 0 0 1 -2 2h-6a2 2 0 0 1 -2 -2z m3 0h4m-2 3v1" fill="#2563EB"/>
    </g>
    <!-- 闪电图标 (tabler-filled bolt) -->
    <g id="icon-lightning">
      <path d="M13 2l-6 10h5l-1 8 7 -12h-5l1 -8z" fill="#2563EB"/>
    </g>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 装饰背景圆 -->
  <circle cx="1200" cy="600" r="160" fill="#DBEAFE" fill-opacity="0.3"/>
  <circle cx="100" cy="100" r="80" fill="#DBEAFE" fill-opacity="0.2"/>

  <!-- 标题 -->
  <text x="60" y="110" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="36px" font-weight="bold" fill="#1E293B">什么是微信小程序</text>

  <!-- 分隔细线 -->
  <line x1="60" y1="135" x2="1220" y2="135" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- 要点列表 -->
  <!-- 第1点 -->
  <circle cx="80" cy="180" r="6" fill="#2563EB"/>
  <text x="110" y="186" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="18px" fill="#1E293B">
    <tspan font-weight="bold">微信小程序</tspan>：无需下载安装，即用即走的轻量级应用
  </text>

  <!-- 第2点 -->
  <circle cx="80" cy="228" r="6" fill="#2563EB"/>
  <text x="110" y="234" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="18px" fill="#1E293B">
    运行在微信客户端内，拥有独立的<tspan font-weight="bold">渲染层</tspan>和<tspan font-weight="bold">逻辑层</tspan>
  </text>

  <!-- 第3点 -->
  <circle cx="80" cy="276" r="6" fill="#2563EB"/>
  <text x="110" y="282" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="18px" fill="#1E293B">
    优势：跨平台（iOS/Android）、流量红利、开发成本低
  </text>

  <!-- 第4点 -->
  <circle cx="80" cy="324" r="6" fill="#2563EB"/>
  <text x="110" y="330" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="18px" fill="#1E293B">
    适用场景：低频工具、电商、内容展示、生活服务
  </text>

  <!-- 右侧图标框 -->
  <!-- 框1: 移动设备 -->
  <rect x="880" y="180" width="120" height="120" rx="16" ry="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#icon-mobile" x="924" y="224" width="32" height="32"/>
  <text x="940" y="330" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#64748B" text-anchor="middle">无需安装</text>

  <!-- 框2: 闪电 -->
  <rect x="880" y="340" width="120" height="120" rx="16" ry="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#icon-lightning" x="924" y="384" width="32" height="32"/>
  <text x="940" y="490" font-family="Inter, Arial, Helvetica Neue, sans-serif" font-size="16px" fill="#64748B" text-anchor="middle">即用即走</text>
</svg>