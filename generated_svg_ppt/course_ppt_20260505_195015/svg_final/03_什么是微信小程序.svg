    适用场景：低频工具、电商、内容展示、生活服务
  </text>

  
  
  <path fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" d="M896,180 H984 A16,16 0 0 1 1000,196 V284 A16,16 0 0 1 984,300 H896 A16,16 0 0 1 880,284 V196 A16,16 0 0 1 896,180 Z" />
