  <rect width="1280" height="720" fill="#FFFFFF" />

  
  <circle cx="1200" cy="600" r="160" fill="#DBEAFE" fill-opacity="0.3" />
  <circle cx="100" cy="100" r="80" fill="#DBEAFE" fill-opacity="0.2" />

  
  <text x="60" y="110" font-family="Microsoft YaHei" font-size="36px" font-weight="bold" fill="#1E293B">什么是微信小程序</text>

  
  <line x1="60" y1="135" x2="1220" y2="135" stroke="#E2E8F0" stroke-width="1.5" />

  
  
  <circle cx="80" cy="180" r="6" fill="#2563EB" />
  <text x="110" y="186" font-family="Microsoft YaHei" font-size="18px" fill="#1E293B">
    <tspan font-weight="bold" font-family="Microsoft YaHei">微信小程序</tspan>：无需下载安装，即用即走的轻量级应用
  </text>

  
  <circle cx="80" cy="228" r="6" fill="#2563EB" />
  <text x="110" y="234" font-family="Microsoft YaHei" font-size="18px" fill="#1E293B">
    运行在微信客户端内，拥有独立的<tspan font-weight="bold" font-family="Microsoft YaHei">渲染层</tspan>和<tspan font-weight="bold" font-family="Microsoft YaHei">逻辑层</tspan>
  </text>

  
  <circle cx="80" cy="276" r="6" fill="#2563EB" />
  <text x="110" y="282" font-family="Microsoft YaHei" font-size="18px" fill="#1E293B">
